[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
auto_detect_solc = false
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
ffi = false

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true
